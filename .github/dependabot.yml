# Concretely implements the workspace repo's AGENTS.md "currency" mandate
# for dependency updates: Rails, webauthn-ruby, bcrypt, and Ruby tooling all
# get automated, weekly update PRs rather than relying on someone remembering
# to check quarterly. The quarterly review in AGENTS.md is for the things
# Dependabot can't see -- Rails release notes, the WebAuthn spec, the
# competitor landscape -- not for dependency version bumps themselves.
version: 2
updates:
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
    groups:
      webauthn:
        patterns: ["webauthn", "public_suffix", "cose", "cbor", "bindata"]
      rails:
        patterns: ["rails", "railties", "activesupport", "activemodel", "actionpack", "activerecord", "actionmailer", "activejob", "turbo-rails", "stimulus-rails"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
