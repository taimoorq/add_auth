name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new PR head replaces obsolete work. Different PRs/manual branches are independent.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }} / ${{ matrix.suite }}"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: add_auth_external_test
          POSTGRES_PASSWORD: test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d add_auth_external_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        # Oldest Ruby remains security-supported; keep floors/required gates aligned.
        ruby: ["3.3", "3.4", "4.0"]
        rails: ["8_0", "8_1"]
        suite: [product, migration, providers]
        include:
          - suite: product
            profile: rails
          - suite: migration
            profile: devise_rails
          - suite: providers
            profile: providers_rails
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/${{ matrix.profile }}_${{ matrix.rails }}.gemfile
      ADD_AUTH_CI_REPORT_ROOT: ${{ github.workspace }}/tmp/ci-reports
      ADD_AUTH_MICROSOFT_DATABASE_URL: postgresql://postgres:test-only@localhost:5432/add_auth_external_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run the complete shard and record outer/inner RSpec evidence
        run: bundle exec ruby .github/scripts/ci_suite.rb ruby "${{ matrix.rails }}" "${{ matrix.suite }}"
      - name: Lint
        if: matrix.suite == 'product'
        run: bundle exec standardrb
      - name: Upload shard evidence, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-ruby-${{ matrix.ruby }}-${{ matrix.rails }}-${{ matrix.suite }}
          path: ${{ env.ADD_AUTH_CI_REPORT_ROOT }}
          if-no-files-found: error
          retention-days: 14
          archive: true

  ruby-gate:
    name: "Ruby ${{ matrix.ruby }}"
    needs: test
    if: always()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "4.0"]
    env:
      ADD_AUTH_CI_DEPENDENCY_RESULT: ${{ needs.test.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ci-${{ github.run_id }}-${{ github.run_attempt }}-ruby-${{ matrix.ruby }}-*
          path: ${{ runner.temp }}/ci-evidence
          merge-multiple: false
          digest-mismatch: error
      - name: Require all six shards, full browser partitions and successful RSpec evidence
        run: ruby .github/scripts/ci_matrix.rb ruby "${{ matrix.ruby }}" "${{ runner.temp }}/ci-evidence"

  postgres-shards:
    name: "PostgreSQL / Rails ${{ matrix.rails }} / ${{ matrix.suite }}"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: add_auth_test
          POSTGRES_PASSWORD: test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d add_auth_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        rails: ["8_0", "8_1"]
        suite: [stores, migration, native, keys]
        include:
          - suite: stores
            profile: rails
          - suite: migration
            profile: devise_rails
          - suite: native
            profile: providers_rails
          - suite: keys
            profile: rails
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/${{ matrix.profile }}_${{ matrix.rails }}.gemfile
      ADD_AUTH_CI_REPORT_ROOT: ${{ github.workspace }}/tmp/ci-reports
      ADD_AUTH_TEST_DATABASE_URL: postgresql://postgres:test-only@localhost:5432/add_auth_test
      ADD_AUTH_EXTERNAL_DATABASE_URL: postgresql://postgres:test-only@localhost:5432/add_auth_external_test
      ADD_AUTH_KEYS_DATABASE_URL: postgresql://postgres:test-only@localhost:5432/add_auth_external_test
      ADD_AUTH_MIGRATION_POSTGRES: "1"
      PGUSER: postgres
      PGPASSWORD: test-only
      PGHOST: localhost
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Create the separate disposable enrollment database
        run: bundle exec ruby -rpg -e 'PG.connect(dbname:"postgres").exec("CREATE DATABASE add_auth_external_test")'
      - name: Run PostgreSQL shard, concurrency and generated-host contracts
        run: bundle exec ruby .github/scripts/ci_suite.rb postgres "${{ matrix.rails }}" "${{ matrix.suite }}"
      - name: Upload shard evidence, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-postgres-${{ matrix.rails }}-${{ matrix.suite }}
          path: ${{ env.ADD_AUTH_CI_REPORT_ROOT }}
          if-no-files-found: error
          retention-days: 14
          archive: true

  postgres:
    name: PostgreSQL
    needs: postgres-shards
    if: always()
    runs-on: ubuntu-latest
    env:
      ADD_AUTH_CI_DEPENDENCY_RESULT: ${{ needs.postgres-shards.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ci-${{ github.run_id }}-${{ github.run_attempt }}-postgres-*
          path: ${{ runner.temp }}/ci-evidence
          merge-multiple: false
          digest-mismatch: error
      - name: Require all eight PostgreSQL shards and successful RSpec evidence
        run: ruby .github/scripts/ci_matrix.rb postgres "3.4" "${{ runner.temp }}/ci-evidence"

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: bundler-audit
        run: |
          gem install bundler-audit
          bundler-audit check --update
          for rails in 8_0 8_1; do
            for profile in rails devise_rails providers_rails; do
              BUNDLE_GEMFILE="gemfiles/${profile}_${rails}.gemfile" bundle install
              bundler-audit check --gemfile-lock "gemfiles/${profile}_${rails}.gemfile.lock"
            done
          done
